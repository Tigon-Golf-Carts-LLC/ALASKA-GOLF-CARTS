name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The DMS inventory refreshes nightly at 10:55 PM ET. Rebuilding at 04:05 UTC
  # picks up that refresh whether ET is on standard or daylight time.
  schedule:
    - cron: "5 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, but let a running one finish.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      # Worked out here rather than via actions/configure-pages, which needs an
      # API call the default GITHUB_TOKEN is not always allowed to make. Derived
      # from GITHUB_REPOSITORY so it is correct on every trigger, including the
      # scheduled rebuild.
      - name: Resolve base path
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner_site="$(echo "${GITHUB_REPOSITORY_OWNER}.github.io" | tr '[:upper:]' '[:lower:]')"
          if [ -n "$CUSTOM_DOMAIN" ] || [ "$(echo "$repo" | tr '[:upper:]' '[:lower:]')" = "$owner_site" ]; then
            # Custom domain, or a user/org site — both serve from the root.
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            # Project site: https://<owner>.github.io/<repo>/
            echo "BASE_PATH=/$repo/" >> "$GITHUB_ENV"
          fi

      # Pulls the DMS inventory into static JSON, builds the bundle, then writes
      # one prerendered HTML file per route plus sitemap.xml. Fails loudly if the
      # DMS API is unreachable, which leaves the previous deployment in place.
      - name: Build static site
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: npm run build:static

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
